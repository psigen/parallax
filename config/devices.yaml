# Known devices. Data only: nothing here is a default; src/device/heuristics.ts decides which
# entry (if any) applies to the machine the browser is running on. Add a device by appending an
# entry; tests check that width/height agree with native_px / ppi and that ids are unique.
#
# Coordinates: screen frame (origin at the display centre, +x right, +y up, +z toward the viewer),
# millimetres. Camera FOVs are horizontal, for the 16:9 stream, and are estimates unless noted:
# calibrate (`c`) to refine the focal length.


cameras:
  - id: apple-12mp-center-stage
    name: Apple 12MP Center Stage camera (1x, Center Stage off)
    label_match: [MacBook Pro Camera, MacBook Air Camera, Studio Display Camera, iMac Camera]
    hfov_deg: 72
    estimate: true
    capture: { width_px: 1280, height_px: 720, frame_rate: 30 }

  - id: apple-facetime-hd-1080p
    name: Apple FaceTime HD camera (1080p)
    label_match: [FaceTime HD Camera]
    max_height_px: 1080
    hfov_deg: 65
    estimate: true
    capture: { width_px: 1280, height_px: 720, frame_rate: 30 }

  - id: apple-facetime-hd-720p
    name: Apple FaceTime HD camera (720p)
    label_match: [FaceTime HD Camera]
    max_height_px: 720
    hfov_deg: 58
    estimate: true
    capture: { width_px: 1280, height_px: 720, frame_rate: 30 }

  - id: logitech-c920
    name: Logitech C920 / C922 (78° diagonal)
    label_match: [C920, C922]
    hfov_deg: 70.4
    estimate: false
    capture: { width_px: 1280, height_px: 720, frame_rate: 30 }
    mount: { position_mm_from_top_centre: [0, 15, 20] }

  - id: logitech-brio
    name: Logitech Brio 4K (90° diagonal default)

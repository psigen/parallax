<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parallax Window</title>
    <link rel="icon" href="data:," />
    <!-- Avenir Next is bundled with macOS/iOS; Nunito Sans is the closest free match elsewhere. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --font-ui:
          'Avenir Next', Avenir, 'Nunito Sans', -apple-system, 'Helvetica Neue', Helvetica, Arial,
          sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #ddd;
        font:
          12px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>

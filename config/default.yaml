# Parallax demo configuration. All physical quantities are in millimetres (keys end in _mm) or
# pixels (keys end in _px). The renderer converts to metres once, in src/config/load.ts.
#
# Coordinate frame ("screen frame"): origin at the centre of the display's active area,
# +x to the viewer's right, +y up, +z out of the screen toward the viewer. See docs/coordinate-systems.md.

screen:
  name: MacBook Pro 14-inch (M4) built-in display
  # Active area, from Apple's 3024x1964 @ 254 ppi. Diagonal works out to 360.6 mm = 14.2 in.
  width_mm: 302.4
  height_mm: 196.4
  # Normally the physical rectangle covered by the browser viewport is derived at runtime from
  # window.screenX/screenY, outer/inner size and screen.width. Set this to pin it instead
  # (screen-frame mm, y up): { left_mm: -151.2, right_mm: 151.2, bottom_mm: -98.2, top_mm: 98.2 }
  viewport_override_mm: null

viewer:
  # Interpupillary distance of the person watching. Depth is derived from how many pixels apart
  # the irises appear, so this scales every distance estimate.
  ipd_mm: 63
  # Eye position used before tracking locks on and after the face is lost.
  default_eye_mm: [0, 0, 550]

default_camera: mbp14-builtin

cameras:
  - id: mbp14-builtin
    # Substring matched against MediaDeviceInfo.label to select the device.
    label_match: MacBook Pro Camera
    capture: { width_px: 1280, height_px: 720, frame_rate: 30 }
    # false: raw camera frames (image-x increasing = viewer moving to THEIR left).
    mirrored: false
    # Pinhole intrinsics at the reference resolution below; scaled if the stream differs.
    # fx/fy are ESTIMATES derived from the 12MP module's 122 deg full-sensor diagonal FOV at the
    # 1x crop. Calibrate with the in-app procedure (docs/calibration.md). macOS Center Stage
    # must be OFF and zoom at 1x, otherwise these drift at runtime.
    intrinsics:
      width_px: 1280
      height_px: 720
      fx_px: 890
      fy_px: 890
      cx_px: 640
      cy_px: 360
    extrinsics:
      # Lens centre in the screen frame. The lens sits in the notch, ~3.5 mm below the top edge
      # of the active area (top edge is y = +98.2).
      position_mm: [0, 94.7, 0]
      # Pitch, yaw, roll of the optical axis relative to the screen normal, degrees.
      rotation_deg: [0, 0, 0]

  - id: mx-brio
    label_match: MX Brio
    capture: { width_px: 1280, height_px: 720, frame_rate: 60 }
    mirrored: false
    # ESTIMATE at the 90 deg diagonal FOV setting; calibrate. Changing the FOV in Logi Options+
    # changes these.
    intrinsics:
      width_px: 1280
      height_px: 720
      fx_px: 800
      fy_px: 800
      cx_px: 640
      cy_px: 360
    extrinsics:
      # Depends on how the camera is mounted; measure from the display centre.
      position_mm: [0, 110, 20]
      rotation_deg: [0, 0, 0]

tracking:
  # iris_ipd: depth from iris pixel separation and ipd_mm (recommended).
  # face_matrix: depth from MediaPipe's facial transformation matrix (assumes its own FOV; less accurate).
  depth_method: iris_ipd
  # Use head yaw from the face matrix to undo foreshortening of the iris separation.
  yaw_correction: true
  # One Euro filter. Lower min_cutoff = smoother but laggier at rest; higher beta = less lag when moving.
  filter: { min_cutoff_hz: 1.0, beta: 0.05, d_cutoff_hz: 1.0 }
  # Extrapolate the filtered eye position to the frame's display time to hide capture latency.
  prediction: { enabled: true, extra_lead_ms: 0, max_lead_ms: 80 }
  # After this long without a face, ease back to default_eye_mm.
  loss_timeout_ms: 500

rendering:
  scene_url: /scenes/room.glb
  near_mm: 10
  far_mm: 20000

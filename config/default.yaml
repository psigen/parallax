# Parallax demo configuration. All physical quantities are in millimetres (keys end in _mm) or
# pixels (keys end in _px). The renderer converts to metres once, in src/config/load.ts.
#
# Coordinate frame ("screen frame"): origin at the centre of the display's active area,
# +x to the viewer's right, +y up, +z out of the screen toward the viewer. See docs/coordinate-systems.md.

device:
  # Which display and cameras this is running on. `auto` observes the browser (screen size and
  # pixel ratio, platform, GPU string, camera labels) and picks the best match from
  # config/devices.yaml, rounding to the nearest known device or extrapolating when nothing
  # matches; the HUD `device` line says what was decided and how confident it is
  # (docs/devices.md). Nothing here names a specific device: that choice is the heuristic's.
  #
  # To override: `screen: { ref: apple-mbp-14-m4 }` (an index entry, optionally with fields such
  # as width_mm on top), or explicit `screen: { name: bench, width_mm: 500, height_mm: 300 }`;
  # `cameras: [{ ref: logitech-mx-brio, position_mm: [0, 160, 10] }]`; `default_camera: <id>`.
  # Runtime: ?device=<screen id>, ?screen_mm=WxH, ?camera=<camera id>.
  screen: auto
  cameras: auto
  default_camera: auto

viewer:
  # Interpupillary distance of the person watching. Depth is derived from how many pixels apart
  # the irises appear, so this scales every distance estimate.
  ipd_mm: 63
  # Where your eyes usually are, relative to the display centre (mm). Used before tracking locks
  # on and after the face is lost. A laptop display is well below eye level, so this is typically
  # [0, 100..250, 450..650].
  rest_eye_mm: [0, 150, 550]
  # Added to every tracked eye position (mm). Zero is the strict window: the eye is measured from
  # the display centre and the view is geometrically exact. The scene is always axis-aligned with
  # the screen (a flat plate at z = 0), so this is the only way to make "looking at the screen
  # centre" look straight into the scene: shift the tracked eye onto the axis, e.g. [0, -150, 0]
  # for eyes 150 mm above the display centre. That is a deliberate lie by exactly that amount
  # and breaks any comparison with real-world geometry. Press `o` while tracking to re-zero the
  # Y component at your current position (x and z are left alone); `O` reverts to this value.
  eye_offset_mm: [0, 0, 0]

tracking:
  # iris_ipd: depth from iris pixel separation and ipd_mm (recommended).
  # face_matrix: depth from MediaPipe's facial transformation matrix (assumes its own FOV; less accurate).
  depth_method: iris_ipd
  # Use head yaw from the face matrix to undo foreshortening of the iris separation.
  yaw_correction: true
  # Which point to render for: cyclopean (midpoint of the irises), left or right eye. The
  # geometry is exact for one eye only; close the other and pick it to judge correctness.
  eye: cyclopean
  # Multiplies the eye's lateral offset from the screen centre. 1.0 is geometrically correct;
  # a diagnostic knob, not a feature.
  parallax_gain: 1.0
  # One Euro filter. Lower min_cutoff = smoother but laggier at rest; higher beta = less lag when moving.
  filter: { min_cutoff_hz: 1.0, beta: 0.05, d_cutoff_hz: 1.0 }
  # Extrapolate the filtered eye position to the frame's display time to hide capture latency.
  prediction: { enabled: true, extra_lead_ms: 0, max_lead_ms: 80 }
  # After this long without a face, ease back to rest_eye_mm.
  loss_timeout_ms: 500

rendering:
  # A scene id from config/scenes.yaml (room, racoon, ...) or a URL/path to a .glb or a splat
  # file (.spz/.sog/.ply/.splat/.ksplat). ?scene=<id|url> overrides. Scenes without a `window`
  # node are positioned by their manifest `placement`; override fields here, e.g.
  # placement: { scale: 0.1667 } for a room at 1/6 size (docs/scene-authoring.md).
  scene: apartment
  near_mm: 10
  far_mm: 20000

lighting:
  # Use the webcam image as the light entering through the window (docs/lighting.md).
  # Off by default for now; press `l` to turn it on at runtime (shadows need enabled: true at load).
  enabled: false
  # Multiplier on lights authored in the glTF when camera lighting is on.
  scene_lights_scale: 1.0
  environment:
    # Camera frame projected onto the +z hemisphere of an equirectangular map, prefiltered for
    # diffuse + specular image-based lighting.
    enabled: true
    intensity: 1.0
    resolution_px: 256 # equirect width; height is half
    update_hz: 10
    # Directions the camera cannot see fade from the frame's edge colour to its mean over this angle.
    fade_deg: 20
  key_lights:
    # Bright peaks in the camera image become shadow-casting directional lights.
    enabled: true
    analysis_width_px: 96 # frame is downsampled to this width before peak detection
    threshold: 0.8 # linear luminance (0..1) a pixel must exceed to belong to a source
    min_area_px: 3
    max_lights: 4
    merge_radius_px: 3 # blobs with centroids closer than this (analysis px) merge
    brightness:
      # intensity = gain * mean_linear_luminance * (saturated ? saturation_boost : 1) * solid_angle_sr
      gain: 150
      saturation_boost: 2.0
    smoothing_hz: 3 # exponential smoothing of direction and intensity
    hold_frames: 3 # frames a source must persist to appear, and survive after vanishing
    shadows: true
    shadow_map_px: 1024
